name: Release Folio Shelf

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: obsidian-plugin-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - name: Prepare version
        id: prepare
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node <<'NODE'
          const assert = require('node:assert/strict');
          const manifest = require('./manifest.json');
          const pkg = require('./plugin/package.json');
          const lock = require('./plugin/package-lock.json');
          assert.match(manifest.version, /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/);
          assert.deepEqual(require('./plugin/manifest.json'), manifest);
          assert.equal(pkg.version, manifest.version);
          assert.equal(lock.version, manifest.version);
          assert.equal(lock.packages[''].version, manifest.version);
          console.log(manifest.version);
          NODE
          )
          latest_tag=$(git tag --list --sort=-version:refname | awk '/^[0-9]+\.[0-9]+\.[0-9]+$/ && !found { print; found=1 }')
          if [[ -n "$latest_tag" && "$(printf '%s\n' "$latest_tag" "$version" | sort -V | tail -n 1)" != "$version" ]]; then
            echo "::error::Commit a manifest version higher than $latest_tag on main."
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$version"; then
            if [[ "$(git rev-parse "$version^{commit}")" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag $version already points to another commit. Commit a new version on main."
              exit 1
            fi
            if [[ "$(gh release view "$version" --json isDraft --jq .isDraft 2>/dev/null)" == false ]]; then
              echo "Release $version already exists for this commit."
              exit 0
            fi
          fi
          echo "PLUGIN_VERSION=$version" >> "$GITHUB_ENV"
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        if: steps.prepare.outputs.publish == 'true'
        working-directory: plugin
        run: npm ci
      - name: Test
        if: steps.prepare.outputs.publish == 'true'
        working-directory: plugin
        run: npm test
      - name: Build
        if: steps.prepare.outputs.publish == 'true'
        working-directory: plugin
        run: npm run build
      - name: Package
        if: steps.prepare.outputs.publish == 'true'
        working-directory: plugin
        run: Compress-Archive -LiteralPath manifest.json,main.js,styles.css,../LICENSE -DestinationPath folio-shelf.zip
      - name: Attest release assets
        if: steps.prepare.outputs.publish == 'true'
        uses: actions/attest@v4
        with:
          subject-path: |
            plugin/main.js
            plugin/manifest.json
            plugin/styles.css
            plugin/folio-shelf.zip
      - name: Publish GitHub release
        if: steps.prepare.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)" != "$GITHUB_SHA" ]]; then
            echo "::error::main moved after this run started. Run the workflow again from main."
            exit 1
          fi
          for delay in 10 30 60 0; do
            if output=$(gh release create "$PLUGIN_VERSION" --target "$GITHUB_SHA" --title "$PLUGIN_VERSION" --generate-notes \
              plugin/manifest.json plugin/main.js plugin/styles.css plugin/folio-shelf.zip 2>&1); then
              printf '%s\n' "$output"
              exit 0
            fi
            printf '%s\n' "$output" >&2
            if [[ "$delay" == 0 ]] || ! grep -Eq 'HTTP (429|500|502|503|504)([^0-9]|$)' <<< "$output"; then
              exit 1
            fi
            echo "GitHub returned a temporary error. Retrying in ${delay}s."
            sleep "$delay"
          done
