name: Release Obsidian plugin

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - name: Verify version
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const manifest = require('./manifest.json');
          const pkg = require('./plugin/package.json');
          const lock = require('./plugin/package-lock.json');
          assert.equal(process.env.GITHUB_REF_NAME, manifest.version);
          assert.deepEqual(require('./plugin/manifest.json'), manifest);
          assert.equal(pkg.version, manifest.version);
          assert.equal(lock.version, manifest.version);
          assert.equal(lock.packages[''].version, manifest.version);
          NODE
      - name: Install, test, and build
        working-directory: plugin
        run: |
          npm ci
          npm test
          npm run build
          zip obsidian-library-plugin.zip manifest.json main.js styles.css
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            plugin/manifest.json plugin/main.js plugin/styles.css plugin/obsidian-library-plugin.zip
