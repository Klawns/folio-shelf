name: Release Obsidian plugin

on:
  push:
    branches: [main]
    paths:
      - 'plugin/**'
      - 'manifest.json'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: obsidian-plugin-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - name: Prepare version
        id: prepare
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_tag=$(git tag --list --sort=-version:refname | awk '/^[0-9]+\.[0-9]+\.[0-9]+$/ && !found { print; found=1 }')
          if [[ -n "$latest_tag" ]] && git merge-base --is-ancestor "$GITHUB_SHA" "$latest_tag^{}"; then
            latest_sha=$(git rev-parse "$latest_tag^{}")
            if [[ "$latest_sha" != "$GITHUB_SHA" ]] || [[ "$(gh release view "$latest_tag" --json isDraft --jq .isDraft 2>/dev/null)" == false ]]; then
              echo "The latest version tag already contains this commit."
              exit 0
            fi
          fi
          export LATEST_TAG="$latest_tag"
          version=$(node <<'NODE'
          const assert = require('node:assert/strict');
          const manifest = require('./manifest.json');
          const pkg = require('./plugin/package.json');
          const lock = require('./plugin/package-lock.json');
          assert.match(manifest.version, /^[0-9]+\.[0-9]+\.[0-9]+$/);
          assert.deepEqual(require('./plugin/manifest.json'), manifest);
          assert.equal(pkg.version, manifest.version);
          assert.equal(lock.version, manifest.version);
          assert.equal(lock.packages[''].version, manifest.version);
          const parse = value => value.split('.').map(Number);
          const base = parse(manifest.version);
          const latest = parse(process.env.LATEST_TAG || manifest.version);
          const firstDifference = latest.findIndex((part, index) => part !== base[index]);
          const next = firstDifference >= 0 && latest[firstDifference] > base[firstDifference] ? latest : base;
          next[2]++;
          console.log(next.join('.'));
          NODE
          )
          npm --prefix plugin version "$version" --no-git-tag-version
          echo "PLUGIN_VERSION=$version" >> "$GITHUB_ENV"
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        if: steps.prepare.outputs.publish == 'true'
        working-directory: plugin
        run: npm ci
      - name: Test
        if: steps.prepare.outputs.publish == 'true'
        working-directory: plugin
        run: npm test
      - name: Build
        if: steps.prepare.outputs.publish == 'true'
        working-directory: plugin
        run: npm run build
      - name: Package
        if: steps.prepare.outputs.publish == 'true'
        working-directory: plugin
        run: Compress-Archive -LiteralPath manifest.json,main.js,styles.css -DestinationPath obsidian-library-plugin.zip
      - name: Publish GitHub release
        if: steps.prepare.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$PLUGIN_VERSION" --target "$GITHUB_SHA" --title "$PLUGIN_VERSION" --generate-notes \
            plugin/manifest.json plugin/main.js plugin/styles.css plugin/obsidian-library-plugin.zip
