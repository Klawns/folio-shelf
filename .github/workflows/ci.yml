name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  plugin:
    name: Plugin tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - run: npm ci
        working-directory: plugin
      - run: npm test
        working-directory: plugin
      - run: npm run build
        working-directory: plugin

  server:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache: false
      - run: go test ./...
        working-directory: server

  required-tests:
    name: Project tests
    if: always()
    needs: [plugin, server]
    runs-on: ubuntu-latest
    steps:
      - name: Check test results
        env:
          PLUGIN_RESULT: ${{ needs.plugin.result }}
          SERVER_RESULT: ${{ needs.server.result }}
        run: test "$PLUGIN_RESULT" = success && test "$SERVER_RESULT" = success
